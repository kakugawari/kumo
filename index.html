<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#6E86A6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-title" content="くもスケッチ">
<meta name="application-name" content="くもスケッチ">
<meta name="description" content="空に雲を描く、静かなスケッチ帳。">
<title>くもスケッチ</title>
<style>
  :root{
    --ink:#EEF2F8;
    --panel:rgba(14,19,32,.34);
    --panel-solid:rgba(12,17,29,.86);
    --line:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN",-apple-system,"Segoe UI",system-ui,sans-serif;
    background:#080c16;color:var(--ink);-webkit-user-select:none;user-select:none;
  }
  canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

  .ui{transition:opacity .9s ease;}
  body.dim .ui{opacity:.28;}

  .top{
    position:fixed;top:0;left:0;right:0;z-index:5;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
    display:flex;gap:7px;align-items:flex-start;pointer-events:none;
  }
  .top > *{pointer-events:auto;}
  .spacer{flex:1;}
  button{
    font:inherit;color:var(--ink);border:1px solid var(--line);
    background:var(--panel);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
    border-radius:13px;padding:8px 12px;font-size:13px;letter-spacing:.05em;
    display:flex;align-items:center;gap:6px;cursor:pointer;
  }
  button:active{transform:scale(.96);}
  button:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:2px;}
  .mini{padding:8px 10px;font-size:12px;}
  .on{background:rgba(255,255,255,.9);color:#111827;border-color:transparent;}

  .logo{
    background:transparent;border:0;padding:6px 4px;gap:9px;align-items:center;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:15px;letter-spacing:.22em;
    text-shadow:0 1px 14px rgba(0,0,0,.35);
  }
  .logo svg{width:26px;height:16px;opacity:.92;}
  .logo span{transform:translateY(.5px);}
  .menu{
    position:absolute;top:calc(env(safe-area-inset-top) + 50px);left:14px;
    min-width:196px;padding:6px;border-radius:18px;
    background:var(--panel-solid);border:1px solid var(--line);
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    box-shadow:0 14px 40px rgba(0,0,0,.35);
    transform-origin:12px 0;transform:scale(.94) translateY(-6px);opacity:0;
    pointer-events:none;transition:opacity .2s,transform .24s cubic-bezier(.2,.9,.3,1);
  }
  .menu.open{opacity:1;transform:none;pointer-events:auto;}
  .mi{
    width:100%;border:0;background:transparent;border-radius:13px;
    flex-direction:column;align-items:flex-start;gap:1px;padding:9px 13px;
  }
  .mi span{font-size:13.5px;letter-spacing:.09em;}
  .mi em{font-style:normal;font-size:10.5px;opacity:.5;letter-spacing:.06em;}
  .mi:active{background:rgba(255,255,255,.12);}
  .mi.danger span{color:#FFB4A8;}
  .sep{height:1px;background:rgba(255,255,255,.1);margin:5px 12px;}

  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);
    display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .sizewrap{
    width:min(400px,90%);background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-radius:15px;padding:5px 14px;display:flex;align-items:center;gap:10px;
  }
  .sizewrap span{font-size:10.5px;opacity:.6;letter-spacing:.12em;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent;}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(255,255,255,.3);border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:#fff;margin-top:-8px;box-shadow:0 1px 8px rgba(0,0,0,.4);
  }
  input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,.3);border-radius:2px;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff;}

  .tools{
    display:flex;flex-direction:column;gap:3px;
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
    border-radius:20px;padding:6px 8px;max-width:100%;overflow-x:auto;scrollbar-width:none;
  }
  .tools::-webkit-scrollbar{display:none;}
  .trow{display:flex;align-items:center;gap:2px;}
  .trow + .trow{border-top:1px solid rgba(255,255,255,.07);padding-top:3px;}
  .rlab{
    flex:0 0 15px;font-style:normal;font-size:9.5px;opacity:.42;
    text-align:center;letter-spacing:0;
  }
  .tool{
    flex:0 0 auto;border:0;background:transparent;border-radius:14px;
    padding:5px 7px 4px;flex-direction:column;gap:2px;min-width:57px;
  }
  .tool svg{width:23px;height:23px;opacity:.82;}
  .tool small{font-size:9.5px;letter-spacing:0;opacity:.78;white-space:nowrap;}
  .tool[aria-pressed=true]{background:rgba(255,255,255,.92);color:#111827;}
  .tool[aria-pressed=true] svg,.tool[aria-pressed=true] small{opacity:1;}

  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--panel-solid);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-radius:26px 26px 0 0;border-top:1px solid var(--line);
    padding:12px 18px calc(env(safe-area-inset-bottom) + 18px);
    transform:translateY(103%);transition:transform .38s cubic-bezier(.22,.9,.3,1);
  }
  .sheet.open{transform:translateY(0);}
  .grab{width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.28);margin:0 auto 14px;}
  .sheet h2{font-size:10.5px;font-weight:400;letter-spacing:.24em;opacity:.5;margin:16px 0 9px;}
  .sheet h2:first-of-type{margin-top:0;}
  .presets{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
  .presets::-webkit-scrollbar{display:none;}
  .preset{flex:0 0 auto;border:0;background:none;padding:0;flex-direction:column;gap:6px;}
  .preset i{display:block;width:50px;height:50px;border-radius:50%;border:2px solid transparent;box-shadow:0 3px 14px rgba(0,0,0,.35);}
  .preset[aria-pressed=true] i{border-color:rgba(255,255,255,.95);}
  .preset small{font-size:10.5px;opacity:.75;}
  .rows{display:flex;flex-wrap:wrap;gap:8px;}
  .row{
    flex:1 1 46%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,.06);border-radius:12px;padding:8px 12px;font-size:12px;
  }
  .row input[type=color]{
    -webkit-appearance:none;appearance:none;border:1px solid var(--line);
    width:32px;height:24px;border-radius:7px;background:none;padding:0;
  }
  .row input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  .row input[type=color]::-webkit-color-swatch{border:0;border-radius:5px;}
  .row.wide{flex:1 1 100%;}
  .hintline{font-size:11px;opacity:.5;margin:14px 0 0;line-height:1.7;}

  .hint{
    position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);z-index:4;
    font-size:13px;letter-spacing:.14em;color:rgba(255,255,255,.86);
    text-shadow:0 1px 14px rgba(0,0,0,.4);pointer-events:none;transition:opacity .7s;
  }
  .veil{
    position:fixed;inset:0;z-index:30;background:rgba(6,9,16,.93);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;
  }
  .veil.open{display:flex;}
  .veil img{max-width:100%;max-height:70vh;border-radius:8px;box-shadow:0 12px 50px rgba(0,0,0,.6);}
  .veil p{font-size:12px;opacity:.7;margin:0;}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none;}.ui{transition:none;}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="top ui">
  <button id="logo" class="logo" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 34 20" fill="currentColor" aria-hidden="true">
      <path d="M8.6 19h17.2a5.4 5.4 0 0 0 .9-10.7A7.2 7.2 0 0 0 13.4 5.6 5.9 5.9 0 0 0 4.5 9.4 5.1 5.1 0 0 0 8.6 19z"/>
    </svg>
    <span>くもスケッチ</span>
  </button>
  <div class="menu" id="menu" role="menu">
    <button class="mi" id="skyBtn" role="menuitem"><span>空</span><em>色・太陽・風</em></button>
    <button class="mi" id="soundBtn" role="menuitem"><span>音</span><em id="soundState">環境音 — 切</em></button>
    <div class="sep"></div>
    <button class="mi" id="undoBtn" role="menuitem"><span>元に戻す</span><em>直前の一手だけ取り消す</em></button>
    <button class="mi danger" id="clearBtn" role="menuitem"><span>リセット</span><em id="clearState">描いた雲をすべて消す</em></button>
    <div class="sep"></div>
    <button class="mi" id="saveBtn" role="menuitem"><span>保存</span><em>画像として残す</em></button>
  </div>
</div>

<p class="hint ui" id="hint">空に触れて、雲を置く</p>

<div class="dock ui">
  <div class="sizewrap">
    <span>小</span>
    <input type="range" id="size" min="35" max="200" value="100" aria-label="雲の大きさ">
    <span>大</span>
  </div>
  <div class="tools" id="tools"></div>
</div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h2>空の色</h2>
  <div class="presets" id="presets"></div>
  <h2>詳細</h2>
  <div class="rows">
    <div class="row"><label for="cTop">空・上</label><input type="color" id="cTop"></div>
    <div class="row"><label for="cBot">空・下</label><input type="color" id="cBot"></div>
    <div class="row"><label for="cSun">太陽</label><input type="color" id="cSun"></div>
    <div class="row"><label for="cCloud">雲</label><input type="color" id="cCloud"></div>
    <div class="row wide"><label for="sunSize">太陽の大きさ</label>
      <input type="range" id="sunSize" min="20" max="180" value="90" style="max-width:56%"></div>
    <div class="row wide"><label for="windR">風 — 雲が流れる速さ</label>
      <input type="range" id="windR" min="0" max="100" value="26" style="max-width:56%"></div>
  </div>
  <p class="hintline">「太陽」を選んで空をなぞると太陽が動き、雲の陰影も付け直されます。</p>
</div>

<div class="veil" id="veil">
  <img id="veilImg" alt="描いた空">
  <p>長押しして「イメージを保存」</p>
  <button id="veilClose">閉じる</button>
</div>

<script>
(function(){
'use strict';
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=0,H=0,dpr=1;
function mk(){var c=document.createElement('canvas');return {c:c,x:c.getContext('2d',{willReadFrequently:true})};}
var cloud=mk(), fresh=mk(), rays=mk(), den=mk(), skyC=mk(), starC=mk(), grainC=mk();
var blurOK=(typeof ctx.filter==='string');

/* ================= palettes ================= */
var THEMES={
  hiruma  :{name:'昼',  top:'#1E63B4',bot:'#CFE8F6',sun:'#FFFAE8',dark:'#7E90A6',mid:'#C3D0DE',light:'#F2F7FC',rim:'#FFFFFF'},
  yuyake  :{name:'夕焼け',top:'#6E86A6',bot:'#F7C78C',sun:'#FFD48F',dark:'#575B6E',mid:'#8D8593',light:'#EBC9A0',rim:'#FFE6B4'},
  asayake :{name:'朝焼け',top:'#33538B',bot:'#FBC2A8',sun:'#FFE3C2',dark:'#5B5D78',mid:'#9E93A6',light:'#F6CDBA',rim:'#FFF3E4'},
  tasogare:{name:'黄昏',top:'#131E45',bot:'#E3875F',sun:'#FFBB79',dark:'#242B4E',mid:'#565A80',light:'#BE8B90',rim:'#FFD49E'},
  yoru    :{name:'夜',    top:'#03060F',bot:'#0E1A38',sun:'#E7EEFF',dark:'#0F1832',mid:'#28325A',light:'#68779F',rim:'#D8E2FF'}
};
var S={theme:'yuyake',top:'',bot:'',sun:'',dark:'',mid:'',light:'',rim:'',
       sunX:0.5,sunY:0.30,sunR:0.9,wind:0.26,tool:'cumulus',size:1};
(function(t){for(var k in t)if(k!=='name')S[k]=t[k];})(THEMES.yuyake);
var strokes=[];

/* ================= utils ================= */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hx(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function rgba(h,a){var c=hx(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function mix(a,b,t){var x=hx(a),y=hx(b);return'#'+[0,1,2].map(function(i){var v=Math.round(x[i]+(y[i]-x[i])*t).toString(16);return v.length<2?'0'+v:v;}).join('');}
function lum(h){var c=hx(h);return(c[0]*.299+c[1]*.587+c[2]*.114)/255;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function sunPos(){return{x:S.sunX*W,y:S.sunY*H};}
function baseR(){return Math.min(W,H)*0.115*S.size;}

/* ================= tileable fbm noise (as a float table) ================= */
var NS=256, noiseArr=null;
function buildNoise(){
  var r=rng(20260728),oct=[4,8,16,32,64],amp=[.46,.26,.15,.08,.05],lat=[];
  for(var o=0;o<oct.length;o++){var n=oct[o],a=new Float32Array(n*n);for(var i=0;i<n*n;i++)a[i]=r();lat.push(a);}
  function samp(a,n,u,v){
    var x=u*n,y=v*n,x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;
    var sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
    var i0=((x0%n)+n)%n,i1=(i0+1)%n,j0=((y0%n)+n)%n,j1=(j0+1)%n;
    var v00=a[j0*n+i0],v10=a[j0*n+i1],v01=a[j1*n+i0],v11=a[j1*n+i1];
    return(v00+(v10-v00)*sx)*(1-sy)+(v01+(v11-v01)*sx)*sy;
  }
  noiseArr=new Float32Array(NS*NS);
  var mn=9,mx=-9;
  for(var y=0;y<NS;y++)for(var x=0;x<NS;x++){
    var f=0;
    for(var o2=0;o2<oct.length;o2++)f+=samp(lat[o2],oct[o2],x/NS,y/NS)*amp[o2];
    noiseArr[y*NS+x]=f; if(f<mn)mn=f; if(f>mx)mx=f;
  }
  var sc=1/(mx-mn);
  for(var i2=0;i2<noiseArr.length;i2++)noiseArr[i2]=(noiseArr[i2]-mn)*sc;
}
function nAt(fx,fy){return noiseArr[(((fy|0)&255)<<8)+(((fx|0)&255))];}

/* ================= puff placement ================= */
function bloom(out,x,y,r,depth,rand,o){
  out.push({x:x,y:y,rr:r,sx:o.sx||1});
  if(depth<=0||r<o.min||out.length>o.cap)return;
  for(var i=0;i<o.n;i++){
    var a=rand()*6.2832,d=r*(0.55+rand()*0.45);
    var px=x+Math.cos(a)*d*(o.wide||1.05), py=y+Math.sin(a)*d*(o.tall||0.72);
    if(o.floor!==undefined&&py>o.floor)py=o.floor-(py-o.floor)*0.18;
    bloom(out,px,py,r*(0.52+rand()*0.20),depth-1,rand,o);
  }
}
function genCumulus(x,y,R,seed){
  var r=rng(seed),p=[],o={n:4,min:R*0.055,cap:110,wide:1.25,tall:0.62,floor:y+R*0.26};
  bloom(p,x,y-R*0.04,R*0.48,2,r,o);
  bloom(p,x-R*0.64,y+R*0.18,R*0.31,2,r,o);
  bloom(p,x+R*0.68,y+R*0.15,R*0.33,2,r,o);
  bloom(p,x+R*0.08,y-R*0.40,R*0.22,2,r,o);
  return p;
}
function genNyudo(x,y,R,seed){
  var r=rng(seed),p=[],yb=y+R*0.95,Hh=R*2.3;
  var o={n:3,min:R*0.07,cap:190,wide:1.02,tall:0.95,floor:yb};
  for(var i=0;i<6;i++){
    var t=i/5, sy=yb-t*Hh, sx=x+(r()-0.5)*R*0.5*t;
    bloom(p,sx,sy,R*(0.46-0.14*t)*(1+0.16*Math.sin(t*3.1)),2,r,o);
  }
  var ao={n:3,min:R*0.09,cap:250,wide:1.9,tall:0.40,floor:yb-Hh*0.70};
  for(var k=-2;k<=2;k++)
    bloom(p,x+k*R*0.62+(r()-0.5)*R*0.2, yb-Hh*(0.90+r()*0.07), R*(0.30-Math.abs(k)*0.045),1,r,ao);
  return p;
}
function genScale(x,y,R,seed){
  var r=rng(seed),p=[],cell=R*0.15;
  for(var cx=-8;cx<=8;cx++)for(var cy=-6;cy<=6;cy++){
    var px=x+cx*cell*1.02+(r()-0.5)*cell*0.6;
    var py=y+cy*cell*0.80+(r()-0.5)*cell*0.5;
    var d=Math.hypot((px-x)/(R*1.3),(py-y)/(R*0.8));
    if(d>1||r()>1-d*d*0.9)continue;
    p.push({x:px,y:py,rr:cell*(r()<0.22?0.5:0.30+r()*0.18)*(1-d*0.3),sx:1.3});
  }
  return p;
}
function genCirrus(x,y,R,seed){
  var r=rng(seed),p=[],tilt=(r()-0.5)*0.4;
  for(var i=0;i<44;i++){
    var t=(i/43)*2-1;
    var px=x+t*R*1.55+(r()-0.5)*R*0.10;
    var py=y+t*R*tilt+Math.sin(t*2.6+seed)*R*0.11+(r()-0.5)*R*0.08;
    p.push({x:px,y:py,rr:R*0.12*(1-t*t*0.7)*(0.55+r()*0.7),sx:3.2});
    if(r()<0.4)p.push({x:px+(r()-0.5)*R*0.32,y:py+(r()-0.5)*R*0.2,rr:R*0.05*(0.6+r()),sx:2.6});
  }
  return p;
}
function genUne(x,y,R,seed){
  var r=rng(seed),p=[],o={n:3,min:R*0.10,cap:170,wide:1.55,tall:0.48};
  for(var j=0;j<3;j++){
    var yy=y+(j-1)*R*0.44;
    o.floor=yy+R*0.13;
    for(var i=0;i<4;i++){
      var xx=x+(i-1.5)*R*0.64+(r()-0.5)*R*0.22;
      bloom(p,xx,yy+(r()-0.5)*R*0.06,R*0.27*(1-Math.abs(j-1)*0.13),2,r,o);
    }
  }
  return p;
}
function genHaze(x,y,R,seed){
  var r=rng(seed),p=[];
  for(var i=0;i<28;i++){
    var a=r()*6.2832,d=Math.pow(r(),0.55)*R*1.25;
    p.push({x:x+Math.cos(a)*d*1.9,y:y+Math.sin(a)*d*0.50,rr:R*(0.32+r()*0.52),sx:1.9});
  }
  return p;
}
function genHikou(x,y,R,seed,ang){
  var r=rng(seed),p=[],ca=Math.cos(ang),sa=Math.sin(ang),len=R*1.7;
  for(var i=0;i<24;i++){
    var t=(i/23)-0.5;
    var px=x+ca*len*t, py=y+sa*len*t;
    var w=R*0.05*(1+Math.abs(t)*1.1)*(0.7+r()*0.6);
    p.push({x:px+(r()-0.5)*R*0.05,y:py+(r()-0.5)*R*0.05,rr:w,sx:1});
    if(r()<0.32)p.push({x:px+(r()-0.5)*R*0.2,y:py+(r()-0.5)*R*0.14,rr:R*0.028*(0.5+r()),sx:1.5});
  }
  return p;
}
/* per-brush look: peak density, march steps, absorption, alpha ramp, fbm wobble */
var CP={
  cumulus:{peak:.17,steps:9,absorb:.42,t0:.24,tw:.26,a:1,  wob:1.00},
  nyudo  :{peak:.17,steps:9,absorb:.42,t0:.24,tw:.26,a:1,  wob:1.00},
  une    :{peak:.16,steps:8,absorb:.34,t0:.22,tw:.26,a:1,  wob:0.90},
  scale  :{peak:.30,steps:5,absorb:.20,t0:.16,tw:.18,a:.90,wob:0.55},
  cirrus :{peak:.26,steps:5,absorb:.20,t0:.10,tw:.18,a:.62,wob:1.35},
  haze   :{peak:.10,steps:4,absorb:.10,t0:.05,tw:.15,a:.40,wob:1.50},
  hikou  :{peak:.30,steps:4,absorb:.14,t0:.12,tw:.16,a:.72,wob:0.80}
};
function bbox(p,pad){
  var a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(var i=0;i<p.length;i++){var q=p[i];
    if(q.x-q.rr*q.sx<a)a=q.x-q.rr*q.sx; if(q.x+q.rr*q.sx>c)c=q.x+q.rr*q.sx;
    if(q.y-q.rr<b)b=q.y-q.rr; if(q.y+q.rr>d)d=q.y+q.rr;}
  a-=pad;b-=pad;c+=pad;d+=pad;
  return{x:a,y:b,w:c-a,h:d-b};
}

/* =========================================================
   cloud = density field + light marched toward the sun
   ========================================================= */
function renderCloud(target,s){
  var R=s.R,t=s.t;
  var p = t==='cumulus'?genCumulus(s.x,s.y,R,s.seed)
        : t==='nyudo'  ?genNyudo(s.x,s.y,R,s.seed)
        : t==='une'    ?genUne(s.x,s.y,R,s.seed)
        : t==='scale'  ?genScale(s.x,s.y,R,s.seed)
        : t==='haze'   ?genHaze(s.x,s.y,R,s.seed)
        : t==='hikou'  ?genHikou(s.x,s.y,R,s.seed,s.a||0)
        :               genCirrus(s.x,s.y,R,s.seed);
  if(!p.length)return;
  var bb=bbox(p,R*0.5);
  if(bb.w<3||bb.h<3)return;

  var q=Math.min(0.62, 430/Math.max(bb.w,bb.h));
  var w=Math.max(3,Math.ceil(bb.w*q)), h=Math.max(3,Math.ceil(bb.h*q));
  den.c.width=w; den.c.height=h;
  var g=den.x;

  /* --- 1. accumulate density (additive white on black) --- */
  var cp=CP[t]||CP.cumulus, peak=cp.peak;
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation='source-over';
  g.fillStyle='#000';g.fillRect(0,0,w,h);
  g.setTransform(q,0,0,q,-bb.x*q,-bb.y*q);
  g.globalCompositeOperation='lighter';
  for(var i=0;i<p.length;i++){
    var qq=p[i],rr=qq.rr; if(rr*q<0.6)continue;
    g.save();g.translate(qq.x,qq.y);g.scale(qq.sx,1);
    var gr=g.createRadialGradient(0,0,0,0,0,rr);
    gr.addColorStop(0,'rgba(255,255,255,'+peak+')');
    gr.addColorStop(0.45,'rgba(255,255,255,'+(peak*0.62)+')');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.beginPath();g.arc(0,0,rr,0,6.2832);g.fill();g.restore();
  }
  g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';

  var img=g.getImageData(0,0,w,h), d=img.data, n=w*h;
  var D=new Float32Array(n);

  /* --- 2. break up the field with two octaves of fbm --- */
  var f1=NS/(R*1.45), f2=NS/(R*0.46);
  var o1x=s.seed%233, o1y=(s.seed>>3)%197, o2x=(s.seed>>5)%151, o2y=(s.seed>>7)%179;
  var wob = cp.wob;
  for(var y=0;y<h;y++){
    var wy=bb.y+y/q;
    for(var x=0;x<w;x++){
      var idx=y*w+x, v=d[idx<<2]/255;
      if(v<0.012){D[idx]=0;continue;}
      var wx=bb.x+x/q;
      var nz=nAt(wx*f1+o1x,wy*f1+o1y)*0.68+nAt(wx*f2+o2x,wy*f2+o2y)*0.32;
      D[idx]=v*(1+(nz-0.5)*1.5*wob);
    }
  }

  /* --- 3. march toward the sun, shade, write out --- */
  var sp=sunPos(),ldx=sp.x-s.x,ldy=sp.y-s.y,L=Math.hypot(ldx,ldy)||1;
  ldx/=L;ldy/=L;
  var step=2.4, steps=cp.steps, absorb=cp.absorb;
  var t0=cp.t0, t1=t0+cp.tw, typeA=cp.a;

  var cd=hx(S.dark),cl=hx(S.light),cr=hx(S.rim),cb=hx(S.bot);
  for(var y2=0;y2<h;y2++){
    for(var x2=0;x2<w;x2++){
      var i2=y2*w+x2, dv=D[i2], o=i2<<2;
      if(dv<=t0*0.35){d[o+3]=0;continue;}
      var sum=0,sx2=x2,sy2=y2;
      for(var k=1;k<=steps;k++){
        sx2+=ldx*step;sy2+=ldy*step;
        var ix=sx2|0, iy=sy2|0;
        if(ix<0||iy<0||ix>=w||iy>=h)break;
        var sv=D[iy*w+ix]; if(sv>0)sum+=sv;
      }
      var T=Math.exp(-sum*absorb);
      T=0.09+0.91*T;
      var lm=Math.pow(T,0.85);
      var thin=1-clamp(dv*1.25,0,1);
      var rim=Math.pow(T,2.2)*thin*0.8;
      var r=cd[0]+(cl[0]-cd[0])*lm, gg2=cd[1]+(cl[1]-cd[1])*lm, b=cd[2]+(cl[2]-cd[2])*lm;
      r+=(cr[0]-r)*rim; gg2+=(cr[1]-gg2)*rim; b+=(cr[2]-b)*rim;
      r+=(cb[0]-r)*0.09; gg2+=(cb[1]-gg2)*0.09; b+=(cb[2]-b)*0.09;
      var a=clamp((dv-t0)/(t1-t0),0,1)*typeA;
      d[o]=r;d[o+1]=gg2;d[o+2]=b;d[o+3]=a*255;
    }
  }
  g.putImageData(img,0,0);

  /* --- 4. lay it down, with a soft aura --- */
  var tx=target.x, offs=[0];
  if(bb.x<0)offs.push(W);
  if(bb.x+bb.w>W)offs.push(-W);
  tx.save();
  for(var oi=0;oi<offs.length;oi++){
    var ox=offs[oi];
    if(blurOK){
      tx.filter='blur('+Math.max(2,R*0.05)+'px)';
      tx.globalAlpha=0.42;
      tx.drawImage(den.c,bb.x+ox,bb.y,bb.w,bb.h);
      tx.filter='none';tx.globalAlpha=1;
    }
    tx.drawImage(den.c,bb.x+ox,bb.y,bb.w,bb.h);
  }
  tx.restore();
}
function stampErase(target,s){
  var g=target.x;g.save();g.globalCompositeOperation='destination-out';
  var offs=[0];
  if(s.x-s.R<0)offs.push(W);
  if(s.x+s.R>W)offs.push(-W);
  for(var i=0;i<offs.length;i++){
    var cx=s.x+offs[i];
    var gr=g.createRadialGradient(cx,s.y,0,cx,s.y,s.R);
    gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(.55,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.beginPath();g.arc(cx,s.y,s.R,0,6.2832);g.fill();
  }
  g.restore();
}
function stampRay(s){
  var sp=sunPos(),vx=s.x-sp.x,vy=s.y-sp.y,L=Math.max(70,Math.hypot(vx,vy));
  var a=Math.atan2(vy,vx),far=L*2.7,Wd=s.R*0.55,g=rays.x;
  g.save();g.translate(sp.x,sp.y);g.rotate(a);g.globalCompositeOperation='lighter';
  for(var i=0;i<6;i++){
    var w=Wd*(0.20+i*0.30),al=0.075*(1-i/7);
    var gr=g.createLinearGradient(0,0,far,0);
    gr.addColorStop(0,rgba(S.sun,al*0.45));gr.addColorStop(.16,rgba(S.sun,al));gr.addColorStop(1,rgba(S.sun,0));
    g.fillStyle=gr;g.beginPath();
    g.moveTo(0,-w*0.09);g.lineTo(far,-w);g.lineTo(far,w);g.lineTo(0,w*0.09);
    g.closePath();g.fill();
  }
  g.restore();
}

/* ================= static layers ================= */
function buildSky(){
  var g=skyC.x;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  var gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,S.top);gr.addColorStop(0.62,mix(S.top,S.bot,0.72));gr.addColorStop(1,S.bot);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  var hz=g.createLinearGradient(0,H*0.55,0,H);
  hz.addColorStop(0,rgba(S.bot,0));hz.addColorStop(1,rgba(S.bot,0.55));
  g.fillStyle=hz;g.fillRect(0,H*0.55,W,H*0.45);
}
function buildStars(){
  var g=starC.x;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  var r=rng(7788);
  for(var i=0;i<220;i++){
    var x=r()*W,y=r()*H*0.85,rr=r()*1.1+0.3,a=0.25+r()*0.6;
    g.fillStyle='rgba(255,255,255,'+a+')';g.beginPath();g.arc(x,y,rr,0,6.2832);g.fill();
  }
}
function buildGrain(){
  var N=180;grainC.c.width=grainC.c.height=N;
  var g=grainC.x,img=g.createImageData(N,N),d=img.data,r=rng(4242);
  for(var i=0;i<N*N;i++){var v=(r()*255)|0;d[i*4]=v;d[i*4+1]=v;d[i*4+2]=v;d[i*4+3]=16;}
  g.putImageData(img,0,0);
}

/* ================= composite ================= */
var drift=0,lastT=0,freshA=1,freshOn=false,starA=0,grainPat=null;
function composite(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.drawImage(skyC.c,0,0,W,H);

  starA=clamp((0.30-lum(S.top))*3.4,0,1);
  if(starA>0.01){ctx.globalAlpha=starA*(0.75+0.25*Math.sin(now/2600));ctx.drawImage(starC.c,0,0,W,H);ctx.globalAlpha=1;}

  var sp=sunPos(),puls=1+0.022*Math.sin(now/3400),glow=Math.min(W,H)*(0.16+0.5*S.sunR)*puls;
  ctx.globalCompositeOperation='lighter';
  var gg=ctx.createRadialGradient(sp.x,sp.y,0,sp.x,sp.y,glow);
  gg.addColorStop(0,rgba(S.sun,.92));gg.addColorStop(.09,rgba(S.sun,.5));
  gg.addColorStop(.4,rgba(S.sun,.14));gg.addColorStop(1,rgba(S.sun,0));
  ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
  var core=Math.min(W,H)*0.017*(0.5+S.sunR)*puls;
  var cg=ctx.createRadialGradient(sp.x,sp.y,0,sp.x,sp.y,core);
  cg.addColorStop(0,'rgba(255,255,255,.98)');cg.addColorStop(.55,rgba(S.sun,.88));cg.addColorStop(1,rgba(S.sun,0));
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(sp.x,sp.y,core,0,6.2832);ctx.fill();
  ctx.globalCompositeOperation='source-over';

  var dr=((drift%W)+W)%W;
  ctx.drawImage(cloud.c,dr,0,W,H);
  ctx.drawImage(cloud.c,dr-W,0,W,H);
  if(freshOn){
    ctx.globalAlpha=freshA;
    ctx.drawImage(fresh.c,dr,0,W,H);ctx.drawImage(fresh.c,dr-W,0,W,H);
    ctx.globalAlpha=1;
  }

  ctx.globalCompositeOperation='lighter';
  ctx.drawImage(rays.c,0,0,W,H);
  ctx.globalCompositeOperation='source-over';

  var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.22)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.5;
  if(!grainPat)grainPat=ctx.createPattern(grainC.c,'repeat');
  if(grainPat){ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);}
  ctx.globalAlpha=1;
}
function loop(now){
  if(!lastT)lastT=now;
  var dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  drift+=S.wind*14*dt;
  if(freshOn){freshA=Math.min(1,freshA+dt*2.6);if(freshA>=1)bakeFresh();}
  composite(now);
  requestAnimationFrame(loop);
}

/* ================= strokes ================= */
function bakeFresh(){
  if(!freshOn)return;
  cloud.x.globalAlpha=1;cloud.x.drawImage(fresh.c,0,0,W,H);
  fresh.x.setTransform(dpr,0,0,dpr,0,0);fresh.x.clearRect(0,0,W,H);
  freshOn=false;freshA=1;
}
function layerX(x){return((x-drift)%W+W)%W;}
var SZ={scale:1.3,nyudo:0.85,erase:0.7,une:1.15,haze:2.0,hikou:1.6};
function addStroke(x,y,tap,ang){
  var t=S.tool;
  var R=baseR()*(SZ[t]||1);
  var s={t:t,x:t==='ray'?x:layerX(x),y:y,R:R,seed:(Math.random()*1e6)|0,a:ang||0};
  strokes.push(s);
  if(t==='ray'){stampRay(s);return;}
  bakeFresh();
  if(t==='erase'){stampErase(cloud,s);return;}
  if(tap){
    fresh.x.setTransform(dpr,0,0,dpr,0,0);fresh.x.clearRect(0,0,W,H);
    renderCloud(fresh,s);freshOn=true;freshA=0;
  }else renderCloud(cloud,s);
}
function rebuild(){
  cloud.x.setTransform(dpr,0,0,dpr,0,0);cloud.x.clearRect(0,0,W,H);
  fresh.x.setTransform(dpr,0,0,dpr,0,0);fresh.x.clearRect(0,0,W,H);
  rays.x.setTransform(dpr,0,0,dpr,0,0);rays.x.clearRect(0,0,W,H);
  freshOn=false;
  for(var i=0;i<strokes.length;i++){
    var s=strokes[i];
    if(s.t==='erase')stampErase(cloud,s);
    else if(s.t==='ray')stampRay(s);
    else renderCloud(cloud,s);
  }
}
var pend=false;
function rebuildSoon(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;buildSky();rebuild();});}

/* ================= resize ================= */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  [{c:cv,x:ctx},cloud,fresh,rays,skyC,starC].forEach(function(l){
    l.c.width=Math.round(W*dpr);l.c.height=Math.round(H*dpr);l.x.setTransform(dpr,0,0,dpr,0,0);
  });
  buildSky();buildStars();rebuild();
}
window.addEventListener('resize',resize);

/* ================= input ================= */
var drawing=false,lx=0,ly=0;
function pos(e){var t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
function down(e){
  e.preventDefault();wake();sheet.classList.remove('open');closeMenu();
  var p=pos(e);hideHint();drawing=true;
  if(S.tool==='sun'){S.sunX=p.x/W;S.sunY=p.y/H;rebuildSoon();return;}
  lx=p.x;ly=p.y;addStroke(p.x,p.y,true,-0.12);
}
function move(e){
  if(!drawing)return;e.preventDefault();
  var p=pos(e);
  if(S.tool==='sun'){S.sunX=p.x/W;S.sunY=p.y/H;rebuildSoon();return;}
  var GAP={cumulus:0.8,nyudo:1.1,erase:0.35,une:1.0,haze:1.6,hikou:1.1};
  var gap=baseR()*(GAP[S.tool]||0.85);
  var vx=p.x-lx, vy=p.y-ly;
  if(Math.hypot(vx,vy)<gap)return;
  var ang=Math.atan2(vy,vx);
  lx=p.x;ly=p.y;addStroke(p.x,p.y,false,ang);
}
function up(){drawing=false;}
cv.addEventListener('touchstart',down,{passive:false});
cv.addEventListener('touchmove',move,{passive:false});
cv.addEventListener('touchend',up);
cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);

var presetsEl=document.getElementById('presets');
var cTop=document.getElementById('cTop'),cBot=document.getElementById('cBot'),
    cSun=document.getElementById('cSun'),cCloud=document.getElementById('cCloud');
function syncInputs(){cTop.value=S.top;cBot.value=S.bot;cSun.value=S.sun;cCloud.value=S.mid;}
Object.keys(THEMES).forEach(function(k){
  var t=THEMES[k],b=document.createElement('button');
  b.className='preset';b.type='button';b.dataset.k=k;
  b.setAttribute('aria-pressed',String(k===S.theme));
  b.innerHTML='<i style="background:linear-gradient(165deg,'+t.top+' 8%,'+t.bot+')"></i><small>'+t.name+'</small>';
  b.addEventListener('click',function(){
    S.theme=k;['top','bot','sun','dark','mid','light','rim'].forEach(function(p){S[p]=t[p];});
    Array.prototype.forEach.call(presetsEl.children,function(c){c.setAttribute('aria-pressed',String(c.dataset.k===k));});
    syncInputs();rebuildSoon();wake();
  });
  presetsEl.appendChild(b);
});
cTop.addEventListener('input',function(e){S.top=e.target.value;rebuildSoon();});
cBot.addEventListener('input',function(e){S.bot=e.target.value;rebuildSoon();});
cSun.addEventListener('input',function(e){S.sun=e.target.value;S.rim=mix(e.target.value,'#ffffff',0.3);rebuildSoon();});
cCloud.addEventListener('input',function(e){
  S.mid=e.target.value;S.dark=mix(e.target.value,'#131a2c',0.45);S.light=mix(e.target.value,'#ffffff',0.6);rebuildSoon();
});
document.getElementById('sunSize').addEventListener('input',function(e){S.sunR=e.target.value/100;wake();});
document.getElementById('windR').addEventListener('input',function(e){S.wind=e.target.value/100;wake();});
syncInputs();

var idleT=null;
function wake(){
  document.body.classList.remove('dim');
  clearTimeout(idleT);
  idleT=setTimeout(function(){document.body.classList.add('dim');},5000);
}
window.addEventListener('touchstart',wake,{passive:true});
window.addEventListener('mousedown',wake);
wake();

var hintEl=document.getElementById('hint'),hintGone=false;
function hideHint(){if(hintGone)return;hintGone=true;hintEl.style.opacity='0';setTimeout(function(){if(hintEl.parentNode)hintEl.remove();},800);}
document.getElementById('undoBtn').addEventListener('click',function(){strokes.pop();rebuild();closeMenu();});
var clearBtn=document.getElementById('clearBtn'),clearState=document.getElementById('clearState'),
    clearArmed=false,clearT=null;
function resetClear(){clearArmed=false;clearTimeout(clearT);clearState.textContent='描いた雲をすべて消す';}
clearBtn.addEventListener('click',function(){
  if(!clearArmed){
    clearArmed=true;clearState.textContent='もう一度押すと消えます';
    clearT=setTimeout(resetClear,4000);return;
  }
  strokes=[];rebuild();closeMenu();
});
var veil=document.getElementById('veil'),veilImg=document.getElementById('veilImg');
document.getElementById('saveBtn').addEventListener('click',function(){
  closeMenu();veilImg.src=cv.toDataURL('image/png');veil.classList.add('open');
});
document.getElementById('veilClose').addEventListener('click',function(){veil.classList.remove('open');veilImg.src='';});

/* ================= ambient sound ================= */
var AC=null,soundOn=false;
function startSound(){
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  AC=new C();
  var out=AC.createGain();out.gain.value=0;out.connect(AC.destination);
  var len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}
  var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=340;lp.Q.value=0.6;
  var wg=AC.createGain();wg.gain.value=0.5;
  src.connect(lp);lp.connect(wg);wg.connect(out);
  var lfo=AC.createOscillator();lfo.frequency.value=0.045;
  var lg=AC.createGain();lg.gain.value=180;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  var lfo2=AC.createOscillator();lfo2.frequency.value=0.07;
  var lg2=AC.createGain();lg2.gain.value=0.22;lfo2.connect(lg2);lg2.connect(wg.gain);lfo2.start();
  [110,164.8].forEach(function(f,i){
    var o=AC.createOscillator();o.type='sine';o.frequency.value=f;
    var g=AC.createGain();g.gain.value=0.05;
    var t=AC.createOscillator();t.frequency.value=0.05+i*0.017;
    var tg=AC.createGain();tg.gain.value=0.035;t.connect(tg);tg.connect(g.gain);t.start();
    o.connect(g);g.connect(out);o.start();
  });
  src.start();
  out.gain.linearRampToValueAtTime(0.16,AC.currentTime+3.5);
  soundOn=true;
}
document.getElementById('soundBtn').addEventListener('click',function(){
  var st=document.getElementById('soundState');
  if(!AC){startSound();st.textContent='環境音 — 入';return;}
  if(soundOn){AC.suspend();soundOn=false;st.textContent='環境音 — 切';}
  else{AC.resume();soundOn=true;st.textContent='環境音 — 入';}
});

buildNoise();buildGrain();resize();requestAnimationFrame(loop);

/* service worker */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
})();
</script>
